<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile FPS 3D Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: none; /* Prevents default browser scrolling/zooming */
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="ui">Left half: Drag to move<br>Right half: Drag to look</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue background

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0); // Average human eye level (1.6 units high)

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);

        // --- 3. TEXTURES & MAP CREATION ---
        const textureLoader = new THREE.TextureLoader();

        // Load your specific images (ensure the names match your files exactly)
        const wallTex = textureLoader.load('images (7).jpeg');
        const ceilingTex = textureLoader.load('images (8).jpeg');
        const floorTex = textureLoader.load('images.jpeg');
        const doorTex = textureLoader.load('1000073959-removebg-preview.png');

        // Wrapping settings to repeat textures naturally
        wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
        floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
        
        // Floor
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ map: floorTex });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2; // Lay flat
        scene.add(floor);

        // Ceiling
        const ceilingGeo = new THREE.PlaneGeometry(20, 20);
        const ceilingMat = new THREE.MeshStandardMaterial({ map: ceilingTex });
        const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = 4; // 4 units high
        scene.add(ceiling);

        // Walls (Creating a 20x20 room)
        const wallMat = new THREE.MeshStandardMaterial({ map: wallTex });
        
        const wall1 = new THREE.Mesh(new THREE.PlaneGeometry(20, 4), wallMat);
        wall1.position.set(0, 2, -10);
        scene.add(wall1);

        const wall2 = new THREE.Mesh(new THREE.PlaneGeometry(20, 4), wallMat);
        wall2.position.set(0, 2, 10);
        wall2.rotation.y = Math.PI;
        scene.add(wall2);

        const wall3 = new THREE.Mesh(new THREE.PlaneGeometry(20, 4), wallMat);
        wall3.position.set(-10, 2, 0);
        wall3.rotation.y = Math.PI / 2;
        scene.add(wall3);

        const wall4 = new THREE.Mesh(new THREE.PlaneGeometry(20, 4), wallMat);
        wall4.position.set(10, 2, 0);
        wall4.rotation.y = -Math.PI / 2;
        scene.add(wall4);

        // --- 4. DOOR LOGIC ---
        // Using transparent: true so the PNG background is invisible
        const doorGeo = new THREE.PlaneGeometry(2, 3);
        const doorMat = new THREE.MeshBasicMaterial({ map: doorTex, transparent: true, side: THREE.DoubleSide });
        const door = new THREE.Mesh(doorGeo, doorMat);
        
        // Position the door on wall1
        door.position.set(0, 1.5, -9.9);
        scene.add(door);

        let isDoorOpening = false;

        function checkDoorProximity() {
            if (isDoorOpening) return; // Skip if already processing

            const distance = camera.position.distanceTo(door.position);
            
            // If player is within 3 units of the door
            if (distance < 3.0) {
                isDoorOpening = true;
                door.visible = false; // Disappear
                
                // Reappear after 3 seconds (3000 milliseconds)
                setTimeout(() => {
                    door.visible = true;
                    isDoorOpening = false;
                }, 3000);
            }
        }

        // --- 5. MOBILE MULTITOUCH CONTROLS ---
        let moveTouch = { id: null, deltaX: 0, deltaY: 0 };
        let lookTouch = { id: null, lastX: 0, lastY: 0 };
        
        let pitch = 0; // Up/Down rotation
        let yaw = 0;   // Left/Right rotation

        document.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.clientX < window.innerWidth / 2) {
                    // Left half of screen: Movement Joystick
                    if (moveTouch.id === null) {
                        moveTouch.id = touch.identifier;
                        moveTouch.startX = touch.clientX;
                        moveTouch.startY = touch.clientY;
                    }
                } else {
                    // Right half of screen: Camera Look
                    if (lookTouch.id === null) {
                        lookTouch.id = touch.identifier;
                        lookTouch.lastX = touch.clientX;
                        lookTouch.lastY = touch.clientY;
                    }
                }
            }
        });

        document.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                
                // Handle Movement (Virtual Joystick)
                if (touch.identifier === moveTouch.id) {
                    moveTouch.deltaX = (touch.clientX - moveTouch.startX) * 0.01;
                    moveTouch.deltaY = (touch.clientY - moveTouch.startY) * 0.01;
                }
                
                // Handle Looking (Camera Swipe)
                if (touch.identifier === lookTouch.id) {
                    let deltaX = touch.clientX - lookTouch.lastX;
                    let deltaY = touch.clientY - lookTouch.lastY;
                    
                    yaw -= deltaX * 0.005;
                    pitch -= deltaY * 0.005;
                    
                    // Clamp pitch to prevent breaking your neck (looking too far up/down)
                    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                    
                    lookTouch.lastX = touch.clientX;
                    lookTouch.lastY = touch.clientY;
                }
            }
        });

        document.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.identifier === moveTouch.id) {
                    moveTouch.id = null;
                    moveTouch.deltaX = 0;
                    moveTouch.deltaY = 0;
                }
                if (touch.identifier === lookTouch.id) {
                    lookTouch.id = null;
                }
            }
        });

        // --- 6. GAME LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Apply camera rotations
            camera.rotation.set(pitch, yaw, 0, 'YXZ');

            // Apply movement based on joystick input and camera direction
            if (moveTouch.id !== null) {
                const moveSpeed = 5.0 * delta;
                
                // Forward/Backward
                camera.position.z += Math.cos(yaw) * moveTouch.deltaY * moveSpeed;
                camera.position.x += Math.sin(yaw) * moveTouch.deltaY * moveSpeed;
                
                // Strafe Left/Right
                camera.position.z += Math.cos(yaw + Math.PI/2) * moveTouch.deltaX * moveSpeed;
                camera.position.x += Math.sin(yaw + Math.PI/2) * moveTouch.deltaX * moveSpeed;
            }

            // Keep player firmly on the floor
            camera.position.y = 1.6; 

            // Check if we are close to the door to open it
            checkDoorProximity();

            renderer.render(scene, camera);
        }

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
